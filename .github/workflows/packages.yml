name: Build Coffee packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: sh packaging/linux.sh
      - name: Test the Linux package on Ubuntu 26.04
        run: |
          docker run --rm -v "$PWD:/coffee:ro" ubuntu:26.04 sh -ec '
            apt-get -qq update
            DEBIAN_FRONTEND=noninteractive apt-get -qq install -y --no-install-recommends /coffee/dist/*.deb libheif-plugin-libde265
            coffee --smoke-test --preload /coffee/tests/fixtures/animated.webp
            output=$(coffee --smoke-test --preload /coffee/tests/fixtures/grid.heic)
            printf "%s\n" "$output" | grep -F "128 × 96"
          '
      - uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-libheif
      - shell: msys2 {0}
        run: |
          echo "MSYS2_ROOT=$(cygpath -w /)" >> "$GITHUB_ENV"
      - shell: pwsh
        run: |
          $Version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist, staging
          Copy-Item target/release/coffee.exe staging/Coffee.exe
          Copy-Item -Path README.md, LICENSE, assets/LUCIDE-LICENSE -Destination staging/
          Compress-Archive -Path staging/* -DestinationPath "dist/coffee-${Version}-windows-x86_64.zip"
      - name: Decode media with the packaged Windows executable
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-ChildItem dist/*.zip).FullName -DestinationPath installed
          foreach ($Fixture in 'animated.webp', 'grid.heic') {
            $Result = Start-Process installed/Coffee.exe -ArgumentList '--smoke-test', '--preload', "tests/fixtures/$Fixture" -Wait -PassThru -RedirectStandardOutput smoke.log
            Get-Content smoke.log
            if ($Result.ExitCode -ne 0) { exit $Result.ExitCode }
            if ($Fixture -eq 'grid.heic' -and -not (Select-String -Quiet -Path smoke.log -Pattern '128 × 96')) { exit 1 }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: brew install mpv libheif
      - run: sh packaging/macos.sh
      - name: Decode media with Coffee.app
        run: |
          ditto -x -k dist/*.zip installed
          codesign --verify --strict installed/Coffee.app
          plist=installed/Coffee.app/Contents/Info.plist
          test "$(plutil -extract LSEnvironment.MPVBUNDLE raw -o - "$plist")" = true
          icon=$(plutil -extract CFBundleIconFile raw -o - "$plist")
          test -s "installed/Coffee.app/Contents/Resources/$icon.icns"
          installed/Coffee.app/Contents/MacOS/Coffee --smoke-test --preload tests/fixtures/animated.webp
          output=$(installed/Coffee.app/Contents/MacOS/Coffee --smoke-test --preload tests/fixtures/grid.heic)
          printf '%s\n' "$output" | grep -F '128 × 96'
      - name: Verify macOS keyboard shortcuts
        run: |
          mpv="$(brew --prefix mpv)"
          probe="$RUNNER_TEMP/coffee-keyboard-probe.dylib"
          clang -fobjc-arc -dynamiclib -framework AppKit -I"$mpv/include" -L"$mpv/lib" \
            -lmpv tests/macos-keyboard-probe.m -o "$probe"
          python3 tests/macos-keyboard.py \
            "$PWD/installed/Coffee.app/Contents/MacOS/Coffee" "$probe" "$mpv/lib/libmpv.2.dylib"
      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
